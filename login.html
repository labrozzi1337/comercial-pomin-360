<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pomin360 · Acesso comercial</title>
<link rel="icon" href="/images/icone-p360.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Tela de login na identidade da v3: a parede, o porta-chaves com os molhos e a chave P360 */
:root{--noite:#071827;--void:#030B14;--gelo:#EAF3FF;--gelo2:#A9BBCD;--azul:#00D9F5;--verde:#00E3A4;--coral:#FF6B4A;--linha:rgba(234,243,255,.16)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);background:#06121E url(/images/v3-parede.webp) 30% 0/cover no-repeat;color:var(--gelo);font:400 16px/1.5 Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.cena{position:relative;min-height:100svh;overflow:hidden}
/* mesma geometria da apresentação: --peg é a posição do pino; --ax/--ay, o ponto do aro que encosta nele */
.rack{position:absolute;left:4%;top:16vh;--wp:min(52vw,820px);width:var(--wp)}
.rack img.tabua{width:100%;display:block;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
.molho{--w:calc(var(--wp)*.371);position:absolute;width:var(--w);left:calc(var(--peg)*var(--wp) - var(--ax)*var(--w));top:calc(var(--wp)*.3268 - var(--wp)*.012 - var(--ay)*var(--w));transform-origin:calc(var(--ax)*100%) calc(var(--ay)*66.667%);animation:balanca 3.4s ease-in-out infinite alternate}
.molho.peq{--w:calc(var(--wp)*.371*.52);animation-duration:2.9s}
.pino{position:absolute;z-index:2;width:calc(var(--wp)*.0651);left:calc(var(--peg)*var(--wp) - var(--wp)*.03255);top:calc(var(--wp)*.3268 - var(--wp)*.03255)}
.molho img{width:100%;display:block;filter:drop-shadow(0 30px 30px rgba(0,0,0,.5))}

@keyframes balanca{from{rotate:-2deg}to{rotate:2deg}}
.chave{position:absolute;right:3%;bottom:5vh;width:min(34%,290px);rotate:-10deg;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.lado{position:relative;display:flex;flex-direction:column;justify-content:center;padding:6vh clamp(20px,5vw,64px);background:linear-gradient(90deg,rgba(3,11,20,0),rgba(3,11,20,.82) 18%,rgba(3,11,20,.94))}
.marca img{height:30px;width:auto;display:block;margin-bottom:6vh}
.rotulo{display:flex;align-items:center;gap:.8rem;margin:0 0 1rem;font:600 .72rem 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--gelo2)}
.rotulo i{width:34px;height:1px;background:var(--gelo2)}
h1{margin:0 0 .6rem;font-size:clamp(2.2rem,4vw,3.6rem);font-weight:800;line-height:1;letter-spacing:-.045em}
h1 em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;color:var(--azul);letter-spacing:-.01em}
.sub{margin:0 0 2.2rem;color:var(--gelo2);max-width:26rem}
form{max-width:400px}
label{display:block;margin:0 0 .4rem;font:600 .68rem 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--gelo2)}
input{width:100%;padding:.85rem 1rem;margin-bottom:1.1rem;background:rgba(7,24,39,.8);border:1px solid var(--linha);border-radius:4px;color:var(--gelo);font:500 1rem Montserrat,sans-serif}
input:focus{outline:none;border-color:var(--verde)}
.campo{position:relative}.campo input{padding-right:5.5rem}
.mostrar{position:absolute;right:.5rem;top:.45rem;padding:.4rem .7rem;background:none;border:1px solid var(--linha);border-radius:3px;color:var(--gelo2);font:600 .72rem Montserrat,sans-serif;cursor:pointer}
button[type=submit]{width:100%;min-height:50px;margin-top:.4rem;border:0;border-radius:4px;background:var(--verde);color:#03201A;font:700 1rem Montserrat,sans-serif;cursor:pointer;transition:background .2s}
button[type=submit]:hover{background:#3AF0BD}
.erro{margin:0 0 1rem;padding:.7rem .9rem;border-left:3px solid var(--coral);background:rgba(255,107,74,.1);color:#FFB4A3;font-size:.9rem}
footer{margin-top:5vh;font:600 .64rem 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gelo2)}
:focus-visible{outline:2px solid var(--azul);outline-offset:3px}
@media (max-width:860px){body{grid-template-columns:minmax(0,1fr)}.cena{min-height:52svh}.rack{top:4vh;left:-6%;--wp:112vw}.chave{display:none}.lado{background:linear-gradient(180deg,rgba(3,11,20,0),rgba(3,11,20,.94) 12%);padding-top:2rem}.marca img{margin-bottom:2rem}}
@media (prefers-reduced-motion:reduce){.molho{animation:none}}
</style>
</head>
<body>
<div class="cena" aria-hidden="true">
  <div class="rack">
    <img class="tabua" src="/images/v3-porta-chaves.webp" alt="">
    <div class="molho peq" style="--peg:.3223;--ax:.501;--ay:.1396"><img src="/images/v3-molho-a.webp" alt=""></div>
    <div class="molho" style="--peg:.4993;--ax:.501;--ay:.0576"><img src="/images/v3-molho-logos.webp" alt=""></div>
    <div class="molho peq" style="--peg:.6764;--ax:.5;--ay:.1104;animation-duration:3.8s"><img src="/images/v3-molho-c.webp" alt=""></div>
    <img class="pino" style="--peg:.3223" src="/images/v3-pino.webp" alt=""><img class="pino" style="--peg:.4993" src="/images/v3-pino.webp" alt=""><img class="pino" style="--peg:.6764" src="/images/v3-pino.webp" alt="">
  </div>
  <img class="chave" src="/images/v3-chave-p360-recorte.webp" alt="">
</div>
<main class="lado">
  <a class="marca" href="/" aria-label="Pomin360"><img src="/images/logo-p360.webp" alt="P360"></a>
  <p class="rotulo"><i></i>Acesso comercial</p>
  <h1>Devolva o molho.<br><em>Fique com a chave.</em></h1>
  <p class="sub">Entre para apresentar o Pomin360: tudo em um, com uma chave só.</p>
  <form method="post" action="">
    <label for="usuario">Usuário</label>
    <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="senha">Senha</label>
    <div class="campo"><input id="senha" name="senha" type="password" autocomplete="current-password" required><button type="button" class="mostrar" aria-pressed="false" aria-controls="senha">Mostrar</button></div>
    <input type="hidden" name="h" id="h">
    <!--ERRO-->
    <button type="submit">Entrar</button>
  </form>
  <footer>Grupo Pomin · Pomin360</footer>
</main>
<script>
// Leva o #trecho do link até depois do login; botão mostra/oculta a senha
document.getElementById('h').value=location.hash;
document.querySelector('.mostrar').onclick=e=>{const s=document.getElementById('senha'),on=s.type==='password';s.type=on?'text':'password';e.currentTarget.textContent=on?'Ocultar':'Mostrar';e.currentTarget.setAttribute('aria-pressed',on)};
</script>
</body>
</html>
